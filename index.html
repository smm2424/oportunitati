<style>
:root{--bg:#0b1020;--ink:#e6edf6;--muted:#9fb0c6;--acc:#5eead4}
@media (prefers-color-scheme: light){:root{--bg:#f6f8fb;--ink:#0f172a;--muted:#475569;--acc:#0f766e}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:16px;box-sizing:border-box}
main{max-width:520px;text-align:center}
h1{font-size:22px;margin:0 0 8px} p{color:var(--muted);margin:8px 0} a{color:var(--acc);font-weight:600}
</style>
</head>
<body>
<main>
<h1>TEG · Oportunități</h1>
<p>Dashboard-ul se deschide cu contul Google <b>teg.ro</b> sau <b>codrufestival.ro</b>. Te duc acolo…</p>
<p><a id="intra" href="https://script.google.com/a/macros/teg.ro/s/AKfycbz6U3PzVk9hIE6KxO6oVBP9ELCqQ4Ip_iVV85hvahdUnxJYzRV0RkF_pmjzGGJEpV0z/exec">Deschide dashboard-ul</a></p>
<p style="font-size:13px">Dacă vezi „fără acces” sau o eroare Google, deschide linkul într-o fereastră logată doar cu acel cont.</p>
</main>
<script>
/* v3.6.1 (04.11.2026): păstrează ?id=... (legătura directă din emailul zilnic) și #. Adresa /a/macros/teg.ro/ merge și cu mai multe conturi Google logate. */
(function () {
  var u = 'https://script.google.com/a/macros/teg.ro/s/AKfycbz6U3PzVk9hIE6KxO6oVBP9ELCqQ4Ip_iVV85hvahdUnxJYzRV0RkF_pmjzGGJEpV0z/exec', q = location.search.replace(/^[?]/, '');
  if (q) u += (u.indexOf('?') < 0 ? '?' : '&') + q;
  u += location.hash;
  var a = document.getElementById('intra'); if (a) a.href = u;
  location.replace(u);
})();
</script>
</body>
</html>
