name: Colector
# Colectorul TEG Oportunități: paginile publice care refuză serverele Google (fonduri-structurale.ro, primariatm.ro) → colector/ (GitHub Pages).
# Le citesc scraperul Finanțări (SETARI → FS_OGLINDA, sursa S20) și hub-ul Licitații (PMTM, PMTM2). Nu folosește secrete și nu are date interne.
on:
  schedule:
    - cron: '17 4 * * *'    # 06:17 / 07:17 la Timișoara (iarnă / vară), înainte de colectarea zilnică a scraperului
    - cron: '43 10 * * *'   # 12:43 / 13:43 — a doua copie pentru achizițiile Primăriei
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: colector
  cancel-in-progress: false
jobs:
  colector:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Colectare
        run: python3 colector/colector.py
      - name: Publicare (doar dacă s-a schimbat ceva)
        run: |
          git config user.name "colector-teg"
          git config user.email "colector-teg@users.noreply.github.com"
          git add colector/
          if git diff --cached --quiet; then echo "Nicio schimbare."; exit 0; fi
          git commit -q -m "Colector: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep 10; done
          exit 1
