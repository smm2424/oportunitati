<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-eoQHRBbqu7Cb1Ahg7vIYUpNsyr8TP1LdOop4QiTHtXo='; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https://script.google.com https://script.googleusercontent.com; img-src 'self' data:; frame-src 'self'; base-uri 'none'; form-action 'none'; manifest-src 'none'">
<meta name="theme-color" content="#06120B">
<title>Ecosistem TEG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
 --bg:#EDF1EC;--surface:#FFFFFF;--surface2:#F4F7F3;--sunk:#E4EAE3;--ink:#14231A;--ink2:#4E5F54;--ink3:#7A8A7F;--line:#D5DDD4;--line2:#E6ECE5;
 --moss:#17773A;--moss2:#0F5E2C;--mossbg:#E2F1E6;--lime:#9BFF4F;--amber:#9A6700;--amberbg:#FFF2CF;--rust:#B23A10;--rustbg:#FCE7DE;--blue:#0A4A7C;--bluebg:#E1ECF6;
 --onmoss:#fff;--sh:0 1px 2px rgba(20,35,26,.06),0 8px 24px -12px rgba(20,35,26,.18);--sh2:0 24px 60px -20px rgba(10,25,15,.45);
 --r1:8px;--r2:12px;--r3:18px;--ease:cubic-bezier(.2,.8,.2,1);--side:244px;--top:60px;
 color-scheme:light;
}
:root[data-tema="intunecat"]{
 --bg:#0C1410;--surface:#121C16;--surface2:#16221B;--sunk:#0A110D;--ink:#E3ECE5;--ink2:#A3B5A8;--ink3:#73867A;--line:#243429;--line2:#1C2A21;
 --moss:#45C46B;--moss2:#6BDA89;--mossbg:#173322;--amber:#F2C14E;--amberbg:#2F2610;--rust:#FF8A5C;--rustbg:#3A1C12;--blue:#7DB7E8;--bluebg:#11263A;
 --onmoss:#06120A;--sh:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6);--sh2:0 24px 60px -20px rgba(0,0,0,.8);
 color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.rezumat b,.rb-intarz b{font-variant-numeric:tabular-nums}
a{color:var(--moss);text-underline-offset:2px}
a:hover{color:var(--moss2)}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.01em;line-height:1.2}
h1{font-size:30px;font-weight:800;letter-spacing:-.025em}
h2{font-size:19px}
h3{font-size:15px}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--moss);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* butoane și câmpuri */
.btn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 16px;border-radius:10px;border:1px solid transparent;background:var(--moss);color:var(--onmoss);font-weight:600;cursor:pointer;white-space:nowrap;transition:background .15s,transform .1s,box-shadow .15s;text-decoration:none}
.btn:hover{background:var(--moss2);color:var(--onmoss)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.55;cursor:default}
.btn.sec{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.sec:hover{border-color:var(--ink3);background:var(--surface2)}
.btn.ghost{background:transparent;color:var(--ink2);border-color:transparent}
.btn.ghost:hover{background:var(--sunk);color:var(--ink)}
.btn.rosu{background:transparent;color:var(--rust);border-color:transparent}
.btn.rosu:hover{background:var(--rustbg)}
.btn.mic{height:32px;padding:0 12px;font-size:13.5px;border-radius:8px}
.ib{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:10px;border:0;background:transparent;color:var(--ink2);cursor:pointer;transition:background .15s,color .15s}
.ib:hover{background:var(--sunk);color:var(--ink)}
input,select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;transition:border-color .15s,box-shadow .15s}
textarea{resize:vertical;line-height:1.45}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--moss);box-shadow:0 0 0 3px var(--mossbg)}
label{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin:14px 0 6px}
.camp-cautare{position:relative;max-width:280px;width:100%}
.camp-cautare svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink3)}
.camp-cautare input{padding-left:34px;height:38px}

/* etichete de stare */
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--sunk);color:var(--ink2);white-space:nowrap}
.pill.ok{background:var(--mossbg);color:var(--moss)}
.pill.warn{background:var(--amberbg);color:var(--amber)}
.pill.hot{background:var(--rustbg);color:var(--rust)}
.pill.info{background:var(--bluebg);color:var(--blue)}
.pill .d{width:6px;height:6px;border-radius:50%;background:currentColor}
.id{font-size:12px;font-weight:600;color:var(--ink3);letter-spacing:.02em}
.muted{color:var(--ink2)}
.mic-t{font-size:13px;color:var(--ink3)}

/* intrarea */
#login{position:fixed;inset:0;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(360px,.85fr);background:var(--bg);z-index:50}
.lg-art{position:relative;overflow:hidden;background:#0E2417;color:#EAF5EC;display:flex;flex-direction:column;justify-content:space-between;padding:44px 52px}
.lg-art svg.contur{position:absolute;inset:-10%;width:120%;height:120%;opacity:.55}
.lg-art .marca{position:relative;font-weight:800;font-size:clamp(88px,13vw,190px);line-height:.85;letter-spacing:-.06em;color:#EAF5EC}
.lg-art .marca span{display:block;font-size:.2em;letter-spacing:-.01em;font-weight:600;color:var(--lime);margin-top:18px}
.lg-art .jos{position:relative;max-width:420px;color:#B8D0BE;font-size:15.5px}
.lg-form{display:flex;align-items:center;justify-content:center;padding:32px}
.lg-form form{width:100%;max-width:360px}
.lg-form h1{margin-bottom:8px}
.lg-form .btn{width:100%;justify-content:center;height:44px;margin-top:18px}
#loginErr{min-height:22px;margin-top:12px;color:var(--rust);font-size:14px}
.scutura{animation:scutura .4s var(--ease)}
@keyframes scutura{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}

/* cadrul aplicației */
#app{min-height:100vh;overflow-x:clip}
#side{position:fixed;inset:0 auto 0 0;width:var(--side);background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:30;transition:transform .25s var(--ease)}
.brand{display:flex;align-items:baseline;gap:8px;padding:20px 20px 16px;text-decoration:none;color:var(--ink)}
.brand b{font-size:22px;font-weight:800;letter-spacing:-.04em}
.brand i{font-style:normal;font-size:13.5px;color:var(--ink2);font-weight:500}
.brand .pct{width:8px;height:8px;border-radius:2px;background:var(--lime);box-shadow:0 0 0 1px rgba(20,35,26,.25);align-self:center}
#nav{flex:1;overflow:auto;padding:4px 12px 12px}
#nav .gr{font-size:12px;color:var(--ink3);font-weight:600;padding:14px 10px 6px}
#nav a{position:relative;display:flex;align-items:center;gap:11px;height:38px;padding:0 10px;border-radius:9px;color:var(--ink2);text-decoration:none;font-weight:500;cursor:pointer;transition:background .15s,color .15s}
#nav a:hover{background:var(--surface2);color:var(--ink)}
#nav a.activ{background:var(--mossbg);color:var(--moss);font-weight:600}
#nav a.activ::before{content:"";position:absolute;left:-12px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--moss)}
#nav a .nr{margin-left:auto;font-size:12px;font-weight:700;min-width:22px;height:20px;padding:0 6px;border-radius:999px;display:grid;place-items:center;background:var(--sunk);color:var(--ink2)}
#nav a .nr.hot{background:var(--rustbg);color:var(--rust)}
#nav a .ext{margin-left:auto;color:var(--ink3)}
.side-jos{border-top:1px solid var(--line2);padding:12px;display:flex;align-items:center;gap:10px}
.av{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:14px;background:var(--ink);color:var(--bg);flex:none}
.side-jos .cine{flex:1;min-width:0;line-height:1.25}
.side-jos .cine b{display:block;font-size:14px}
.side-jos .cine span{font-size:12.5px;color:var(--ink3);white-space:nowrap;display:block;overflow:hidden;text-overflow:ellipsis}
#top{position:sticky;top:0;z-index:20;height:var(--top);margin-left:var(--side);display:flex;align-items:center;gap:12px;padding:0 28px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid transparent;transition:border-color .2s}
#top.umbra{border-bottom-color:var(--line)}
#top .titlu{font-weight:700;font-size:15px;opacity:0;transition:opacity .2s}
#top.umbra .titlu{opacity:1}
#top .sp{flex:1}
#cmdBtn{display:inline-flex;align-items:center;gap:10px;height:36px;padding:0 10px 0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink3);cursor:pointer;min-width:250px;font-size:14px}
#cmdBtn:hover{border-color:var(--ink3);color:var(--ink2)}
#cmdBtn kbd{margin-left:auto;font:600 11.5px/1 inherit;padding:4px 6px;border-radius:6px;background:var(--sunk);color:var(--ink2)}
#sync{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--ink3);white-space:nowrap}
#sync .rot{animation:rot 1s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
#burger{display:none}
main{margin-left:var(--side);padding:12px 40px 90px;max-width:1320px}
.pagina{animation:intra .28s var(--ease)}
@keyframes intra{from{opacity:0;transform:translateY(6px)}}
.cap{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:14px 0 24px}
.cap p{margin-top:6px;color:var(--ink2);max-width:72ch}
.cap .act{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sectiune{margin-top:34px}
.sectiune>h2{margin-bottom:12px;display:flex;align-items:center;gap:10px}
.sectiune>h2 .nr{font-size:13px;color:var(--ink3);font-weight:600}
.panou{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2)}
.panou.pad{padding:20px}
.coloane{display:grid;gap:20px;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
.gol{padding:34px 20px;text-align:center;color:var(--ink2)}
.gol b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.nota{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--r1);background:var(--bluebg);color:var(--blue);font-size:14px}
.nota.warn{background:var(--amberbg);color:var(--amber)}

/* schelet de încărcare */
.sk{background:linear-gradient(90deg,var(--sunk) 0,var(--surface2) 40%,var(--sunk) 80%);background-size:300% 100%;animation:sk 1.3s ease-in-out infinite;border-radius:8px}
@keyframes sk{from{background-position:100% 0}to{background-position:0 0}}

/* Azi */
.salut h1{font-size:clamp(30px,3.4vw,40px)}
.salut .zi{color:var(--ink2);margin-top:6px;font-size:16px}
.rezumat{display:flex;flex-wrap:wrap;margin:22px 0 0;border:1px solid var(--line);border-radius:var(--r2);background:var(--surface);overflow:hidden}
.rezumat a{flex:1 1 160px;padding:16px 20px;text-decoration:none;color:var(--ink);border-right:1px solid var(--line2);transition:background .15s}
.rezumat a:last-child{border-right:0}
.rezumat a:hover{background:var(--surface2)}
.rezumat b{display:block;font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.rezumat span{font-size:13.5px;color:var(--ink2)}
.rezumat a.hot b{color:var(--rust)}.rezumat a.warn b{color:var(--amber)}

/* panglica de termene: momentul memorabil al paginii */
.rb{overflow:hidden;margin-top:20px;padding:20px 20px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r3)}
.rb-cap{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:30px}
.rb-leg{display:flex;gap:14px;font-size:13px;color:var(--ink2)}
.rb-leg span{display:inline-flex;align-items:center;gap:6px}
.rb-leg i{width:10px;height:10px;border-radius:3px;background:var(--moss)}
.rb-leg i.auto{background:var(--amber)}
.rb-leg i.urg{background:var(--rust)}
.rb-corp{display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px}
.rb-intarz{min-width:0;border-right:1px dashed var(--line);padding-right:14px}
.rb-intarz b{display:block;font-size:34px;font-weight:800;letter-spacing:-.04em;line-height:1;color:var(--rust)}
.rb-intarz b.zero{color:var(--ink3)}
.rb-intarz span{font-size:13px;color:var(--ink2)}
.rb-intarz button{display:block;width:100%;text-align:left;margin-top:8px;padding:6px 8px;border:0;border-radius:7px;background:var(--rustbg);color:var(--rust);font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rb-pista{position:relative;min-height:150px}
.rb-zile{position:absolute;inset:0;display:grid;grid-template-columns:repeat(31,1fr)}
.rb-zile div{border-left:1px solid var(--line2);position:relative}
.rb-zile div.we{background:var(--surface2)}
.rb-zile div.luni{border-left-color:var(--line)}
.rb-zile em{position:absolute;bottom:-2px;left:4px;font-style:normal;font-size:11.5px;color:var(--ink3);white-space:nowrap}
.rb-azi{position:absolute;top:-6px;bottom:18px;left:0;width:2px;background:var(--ink);transform-origin:top}
.rb-azi::after{content:"azi";position:absolute;top:-16px;left:-4px;font-size:11.5px;font-weight:700;color:var(--ink)}
.mk{position:absolute;height:26px;line-height:26px;max-width:190px;display:block;padding:0 9px 0 10px;text-align:left;border-radius:7px;border:0;background:var(--mossbg);color:var(--moss);font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:inset 3px 0 0 var(--moss);transition:transform .15s var(--ease),box-shadow .15s}
.mk:hover,.mk:focus-visible{transform:translateY(-2px);z-index:2;max-width:none}
.mk.auto{background:var(--amberbg);color:var(--amber);box-shadow:inset 3px 0 0 var(--amber)}
.mk.urg{background:var(--rustbg);color:var(--rust);box-shadow:inset 3px 0 0 var(--rust)}
.rb.anim .rb-azi{animation:creste .7s var(--ease) both}
.rb.anim .mk{animation:cade .45s var(--ease) both;animation-delay:calc(.35s + var(--k,0) * 45ms)}
@keyframes creste{from{transform:scaleY(0)}}
@keyframes cade{from{opacity:0;transform:translateY(-10px)}}

/* liste de taskuri */
.filtre{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.filtre button{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink2);font-size:13.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:all .15s}
.filtre button span{font-size:12px;color:var(--ink3)}
.filtre button:hover{border-color:var(--ink3)}
.filtre button.activ{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.filtre button.activ span{color:inherit;opacity:.7}
.grup{margin-bottom:22px}
.grup h3{font-size:13.5px;color:var(--ink2);margin:0 0 8px 4px;display:flex;gap:8px;align-items:center}
.grup h3.hot{color:var(--rust)}
.lista{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);overflow:hidden}
.rt{display:flex;align-items:center;gap:14px;padding:12px 16px;border-top:1px solid var(--line2);cursor:pointer;transition:background .12s}
.rt:first-child{border-top:0}
.rt:hover{background:var(--surface2)}
.rt .chk{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:var(--surface);flex:none;cursor:pointer;display:grid;place-items:center;color:transparent;transition:all .15s}
.rt .chk:hover{border-color:var(--moss);color:var(--moss)}
.rt .chk svg{width:13px;height:13px;stroke-width:3}
.rt .corp{flex:1;min-width:0}
.rt .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt .m{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--ink3);margin-top:2px}
.rt .urg{color:var(--rust);font-weight:600}
.rt.facut .t{text-decoration:line-through;color:var(--ink3)}
.rt.facut .chk{background:var(--moss);border-color:var(--moss);color:#fff;animation:bifa .35s var(--ease)}
@keyframes bifa{40%{transform:scale(1.25)}}

/* tabele */
.tabwrap{overflow:auto;max-height:72vh;border:1px solid var(--line);border-radius:var(--r2);background:var(--surface)}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}
th{position:sticky;top:0;z-index:1;background:var(--surface2);text-align:left;font-size:12.5px;font-weight:600;color:var(--ink2);padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line2);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr{transition:background .12s}
tbody tr:hover td{background:var(--surface2)}
td.nr,th.nr{text-align:right;white-space:nowrap}
table.nw td{white-space:nowrap}

/* firme */
.firme{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}
.firma{padding:18px 18px 14px}
.firma .fc{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:10px}
.firma ul{list-style:none;margin:0;padding:0}
.firma li{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:6px 0;border-top:1px solid var(--line2);font-size:14px}
.firma li:first-child{border-top:0}
.firma li a{font-weight:600;text-decoration:none}
.firma li a:hover{text-decoration:underline}
.firma .lipsa{margin-top:10px;padding:10px 12px;border-radius:var(--r1);background:var(--rustbg);color:var(--rust);font-size:13.5px}
.firma.are-lipsa{box-shadow:inset 0 3px 0 var(--rust)}

/* link-uri */
.linkuri{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.lk{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r2);border:1px solid var(--line);background:var(--surface);text-decoration:none;color:var(--ink);transition:border-color .15s,transform .15s var(--ease)}
.lk:hover{border-color:var(--moss);color:var(--ink);transform:translateY(-1px)}
.lk .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--mossbg);color:var(--moss);flex:none}
.lk b{display:block;font-weight:600}
.lk span{font-size:12.5px;color:var(--ink3)}
/* link-uri utile: pătrate ca pe ecranul unui telefon, titlul fișierului e lucrul cel mai vizibil */
.plac{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.pl{aspect-ratio:1/1;display:flex;flex-direction:column;justify-content:space-between;padding:16px;border-radius:22px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--ink);box-shadow:var(--sh);transition:transform .18s var(--ease),box-shadow .18s,border-color .18s}
.pl:hover{transform:translateY(-3px) scale(1.015);border-color:var(--moss);color:var(--ink)}
.pl:active{transform:scale(.97)}
.pl .ic{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;color:#fff}
.pl .ic svg{width:24px;height:24px;stroke-width:2}
.pl .ic.foaie{background:linear-gradient(145deg,#1FA463,#137A45)}
.pl .ic.dosar{background:linear-gradient(145deg,#3B82C4,#0A4A7C)}
.pl .ic.ext{background:linear-gradient(145deg,#8A94A0,#5B6570)}
.pl .ic.doc{background:linear-gradient(145deg,#E0A21B,#B07A06)}

/* fișa taskului */

.fl-firma{all:unset;cursor:pointer}.fl-firma:hover{color:var(--moss)}.fl-firma:focus-visible{outline:2px solid var(--moss);outline-offset:2px;border-radius:4px}
.acte-l{margin:12px 0 0;padding-left:18px;line-height:1.8}
.dl-c{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:6px 12px;margin:12px 0 0;font-size:14px}.dl-c dt{color:var(--ink3)}.dl-c dd{margin:0;overflow-wrap:anywhere}

.kpi-c:hover{transform:translateY(-2px)}.kpi-c:active{transform:scale(.97)}.kpi-c:focus-visible{outline:2px solid var(--moss);outline-offset:2px}
tfoot tr.tot td{border-top:2px solid var(--line);background:var(--surface2);font-variant-numeric:tabular-nums}
.kpi-c.st{cursor:default}.kpi-c.st:hover{transform:none}
.ct-lista{display:flex;flex-direction:column;border-radius:var(--r3);background:var(--surface);box-shadow:var(--sh);overflow:hidden}
.ct-rand{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:16px;padding:14px 18px;border-top:1px solid var(--line2);transition:background-color .12s var(--ease)}
.ct-rand:first-child{border-top:0}.ct-rand:hover{background:var(--surface2)}.ct-rand:focus-visible{outline:2px solid var(--moss);outline-offset:-2px}
.ct-rand.ct-alte{border-top:6px solid var(--line2)}
.ct-n{flex:1;min-width:0;font-weight:600;font-size:15px}.ct-n i{display:block;font-style:normal;font-weight:400;font-size:12.5px;color:var(--ink3);margin-top:2px}
.ct-rand b{font-size:17px;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}.ct-rand b.rau{color:var(--rust)}.ct-rand b.bun{color:var(--moss)}
.fr-h3{font-size:14px;margin:18px 0 4px;color:var(--ink2)}
.acte-l li span+b{float:right;font-variant-numeric:tabular-nums;margin-left:10px}
@media (max-width:640px){.ct-rand{flex-wrap:wrap;gap:4px 12px}.ct-rand b{font-size:16px}}
.kpi-c span{font-size:13px;color:var(--ink2)}.kpi-c b{font-size:26px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}.kpi-c i{font-style:normal;font-size:13px;color:var(--ink3)}
.fr-meta-t{margin:0;color:var(--ink2);font-size:14px;line-height:1.5}
.fr-ev.cl{border-left-color:var(--blue)}.fr-ev.cl .x{color:var(--ink);font-size:14.5px}
.placuta{display:inline-flex;align-items:stretch;border:2px solid var(--ink);border-radius:7px;overflow:hidden;background:#fff;color:#14231A;font-weight:800;font-size:19px;letter-spacing:.06em}
.placuta span{background:#0A4A7C;color:#fff;font-size:10px;font-weight:700;padding:3px 5px;display:flex;align-items:flex-end;letter-spacing:0;margin-right:10px}
.placuta{padding-right:12px}
.acte-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.act-p{display:flex;flex-direction:column;padding:9px 11px;border-radius:10px;background:var(--surface2)}
.act-p span{font-size:12px;font-weight:700;color:var(--ink2)}.act-p b{font-size:15px;font-variant-numeric:tabular-nums}.act-p i{font-style:normal;font-size:12px;font-weight:600;color:var(--ink3)}
.act-p.rau{background:var(--rustbg)}.act-p.rau i{color:var(--rust)}.act-p.curand{background:var(--amberbg)}.act-p.curand i{color:var(--amber)}
.auto-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.auto-c{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:12px;padding:20px;border-radius:var(--r3);background:var(--surface);box-shadow:var(--sh);border:1px solid transparent;transition:transform .15s var(--ease)}
.auto-c:hover{transform:translateY(-2px)}.auto-c:focus-visible{outline:2px solid var(--moss);outline-offset:2px}
.auto-c.rau{border-color:var(--rust)}
.auto-c h3{margin:0;font-size:17px}.auto-c .sub{font-size:13.5px;color:var(--ink2)}.auto-c .jos{padding-top:10px;border-top:1px solid var(--line2);font-size:13px;color:var(--ink3)}
.bifa-t{all:unset;box-sizing:border-box;cursor:pointer;width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;background:var(--surface)}
.bifa-t.da{background:var(--moss);border-color:var(--moss);color:#fff}.bifa-t svg.i{width:15px;height:15px}
tr.rand-fisa{cursor:pointer}tr.rand-fisa:hover td{background:var(--surface2)}
.taburi{display:inline-flex;gap:4px;padding:4px;background:var(--sunk);border-radius:12px;margin-bottom:16px}
.taburi button{all:unset;cursor:pointer;height:36px;padding:0 14px;border-radius:9px;font-size:14px;font-weight:650;color:var(--ink2)}
.taburi button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--sh)}
.fr-gata{width:100%;justify-content:center;height:46px;font-size:15.5px}

.chat{display:flex;flex-direction:column;gap:14px}
.msg-eu{align-self:flex-end;max-width:84%;padding:10px 14px;border-radius:14px 14px 4px 14px;background:var(--ink);color:var(--bg);white-space:pre-wrap;overflow-wrap:anywhere}
.msg-ai{max-width:100%;overflow-wrap:anywhere}
.msg-ai p{margin:6px 0}
.msg-ai ul,.msg-ai ol{margin:6px 0;padding-left:22px}

.msg-ai pre{margin:8px 0;padding:12px;border-radius:10px;background:var(--sunk);overflow:auto;font-size:13px}

.msg-ai .dom{font-size:11.5px;color:var(--ink3);margin-left:4px}
.pas{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink3)}
.pas::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ink3)}
.lucreaza{display:inline-flex;align-items:center;gap:10px;font-size:13.5px;color:var(--ink2)}
.puncte{display:inline-flex;gap:4px}

.puncte i:nth-child(2){animation-delay:.15s}.puncte i:nth-child(3){animation-delay:.3s}
@keyframes punct{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.err{color:var(--rust)}
.as{display:grid;grid-template-columns:270px minmax(0,1fr);gap:20px;height:calc(100vh - var(--top) - 120px);min-height:480px}

@keyframes fade{from{opacity:0}}

}

/* ===== TEMA E (26.11.2026): sticlă peste „Curent de codru”, accente pe secțiuni, Inter =====
   Stratul acesta stă la final și suprascrie doar aspectul; structura și funcțiile paginilor rămân aceleași. */
:root{
 --side:256px;--top:64px;--r1:12px;--r2:20px;--r3:28px;--ease:cubic-bezier(.23,1,.32,1);
 --act:#9BFF4F;--act2:#B6FF7E;--onact:#06120B;
 --s-lucru:#3B8F12;--s-acte:#A86F00;--s-bani:#0B8770;--s-unelte:#1D68B0;--s-cont:#566A5C;--s-coral:#C2502A;
 --glass:linear-gradient(180deg,rgba(255,255,255,.80),rgba(255,255,255,.58));
 --glass-brd:rgba(16,36,26,.10);--glass-hi:inset 0 1px 0 rgba(255,255,255,.95);
 --glass-sh:0 1px 2px rgba(16,36,26,.05),0 18px 44px -26px rgba(16,36,26,.38);
 --blur:blur(24px) saturate(160%);
 --bgimg:radial-gradient(1200px 700px at 70% -10%,#CDE5CF,#EEF4EC 62%);
 --solid:#FBFDFB;--inp:#FFFFFF;--nav-act-bg:#0F2418;--nav-act-c:#F1F7F2;
 --bg:#EEF4EC;--surface:#FFFFFF;--surface2:#F2F6F1;--sunk:rgba(16,36,26,.06);--ink:#0F2418;--ink2:#46594C;--ink3:#6A7D70;--line:rgba(16,36,26,.14);--line2:rgba(16,36,26,.075);
 --moss:#17773A;--moss2:#0F5E2C;--mossbg:rgba(23,119,58,.12);--amber:#8A5D00;--amberbg:rgba(255,186,40,.22);--rust:#B23A10;--rustbg:rgba(230,90,40,.14);--blue:#0A4A7C;--bluebg:rgba(31,111,184,.13);
 --onmoss:#FFFFFF;--sh:0 18px 44px -26px rgba(16,36,26,.38);--sh2:0 30px 80px -24px rgba(10,25,15,.45);
}
:root[data-tema="intunecat"]{
 --s-lucru:#9BFF4F;--s-acte:#FFC857;--s-bani:#4FE3C1;--s-unelte:#7CC4FF;--s-cont:#C9D6CC;--s-coral:#FF9F7A;
 --glass:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.035));
 --glass-brd:rgba(255,255,255,.11);--glass-hi:inset 0 1px 0 rgba(255,255,255,.14);
 --glass-sh:0 24px 60px -24px rgba(0,0,0,.7);
 --bgimg:radial-gradient(1200px 700px at 70% -10%,#0F3B22,#06120B 60%);
 --solid:#0B1C12;--inp:rgba(255,255,255,.06);--nav-act-bg:rgba(241,247,242,.94);--nav-act-c:#06120B;
 --bg:#06120B;--surface:#0F2217;--surface2:#13281B;--sunk:rgba(255,255,255,.07);--ink:#F1F7F2;--ink2:#B6C7BB;--ink3:#889B8E;--line:rgba(255,255,255,.14);--line2:rgba(255,255,255,.075);
 --moss:#9BFF4F;--moss2:#C7FF9E;--mossbg:rgba(155,255,79,.14);--amber:#FFD27A;--amberbg:rgba(255,200,87,.17);--rust:#FFB094;--rustbg:rgba(255,128,84,.2);--blue:#A9D8FF;--bluebg:rgba(124,196,255,.16);
 --onmoss:#06120B;--sh:0 24px 60px -24px rgba(0,0,0,.7);--sh2:0 30px 80px -20px rgba(0,0,0,.85);
}
[data-s="lucru"]{--sc:var(--s-lucru)}[data-s="acte"]{--sc:var(--s-acte)}[data-s="bani"]{--sc:var(--s-bani)}[data-s="unelte"]{--sc:var(--s-unelte)}[data-s="cont"]{--sc:var(--s-cont)}[data-s="coral"]{--sc:var(--s-coral)}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bgimg) top center/100% 1200px no-repeat,var(--bg);font-feature-settings:"cv11","ss01"}
a{color:var(--moss)}a:hover{color:var(--moss2)}
:focus-visible{outline-color:var(--moss)}
h1{font-size:clamp(34px,4vw,54px);font-weight:800;letter-spacing:-.04em;line-height:1.04}
.salut h1{font-size:clamp(38px,4.6vw,58px)}
.cap{margin:10px 0 22px}
.cap p,.salut .zi{font-size:15.5px;color:var(--ink2)}

/* fundalul generativ: doar sus, se estompează în culoarea paginii */
#app{position:relative}
#fundal,#voal{position:absolute;left:0;top:0;width:100%;height:1000px;pointer-events:none;z-index:0}
#voal{background:linear-gradient(to bottom,rgba(0,0,0,0) 45%,var(--bg))}
main,#top{position:relative;z-index:1}
#top{position:sticky}

/* sticlă */
#side,.panou,.lista,.tabwrap,.rezumat a,.rb,.kpi-c,.ct-lista,.auto-c,.as-ist,.as-main,.lk,.drop,.pl,.sugestii button,#cmdBtn,.bc-cadru{background:var(--glass);border:1px solid var(--glass-brd);box-shadow:var(--glass-hi),var(--glass-sh);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.panou,.lista,.rb,.ct-lista,.as-ist,.as-main,.bc-cadru{border-radius:var(--r3)}
.tabwrap{border-radius:24px}
.sectiune>h2{font-size:18px}
main[data-s] .sectiune>h2::before,.rb-cap h2::before,.coloane h2::before{content:"";width:8px;height:8px;border-radius:99px;background:var(--sc,var(--moss));flex:none;display:inline-block;margin-right:10px;vertical-align:middle;position:relative;top:-2px}
main[data-s] .sectiune>h2::before{margin-right:0;top:0}

/* meniul: panou de sticlă care plutește */
#side{top:14px;left:14px;bottom:14px;width:var(--side);border-radius:28px;padding:8px;overflow:hidden;border-right:1px solid var(--glass-brd)}
.side-sus{display:flex;align-items:center;gap:6px;padding:6px 4px 8px 12px}
.brand{flex:1;min-width:0;padding:0;align-items:baseline}
.brand b{font-size:20px}
.brand i{color:var(--ink2)}
#sideCorp{display:flex;flex-direction:column;flex:1;min-height:0}
#nav{padding:0 2px 8px}
#nav .gr{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--ink3);padding:14px 12px 6px;margin-top:4px;border-top:1px solid var(--line2)}
#nav .gr:first-child{border-top:0;margin-top:0;padding-top:6px}
#nav .gr i{width:7px;height:7px;border-radius:99px;background:var(--sc)}
#nav a{height:40px;border-radius:99px;padding:0 12px;gap:11px;font-weight:600;color:var(--ink);transition:background-color .12s var(--ease),color .12s var(--ease)}
#nav a svg.i{color:var(--sc)}
#nav a:hover{background:var(--sunk);color:var(--ink)}
#nav a:active{transform:scale(.97)}
#nav a.activ{background:var(--nav-act-bg);color:var(--nav-act-c)}
#nav a.activ svg.i{color:inherit}
#nav a.activ::before{display:none}
#nav a .nr{background:var(--sunk);color:var(--ink2)}
#nav a.activ .nr{background:rgba(127,127,127,.18);color:inherit}
#nav a .nr.hot{background:var(--rustbg);color:var(--rust)}
.side-jos{border-top:1px solid var(--line2);padding:12px 4px 4px 8px}
.av{border-radius:99px;background:rgba(155,255,79,.2);color:var(--moss)}
:root:not([data-tema="intunecat"]) .av{background:var(--mossbg)}
.rotund{border-radius:99px}
.ib{border-radius:99px}
.ib[aria-pressed="true"]{background:var(--mossbg);color:var(--moss)}
#burger,#btnCautaTel{display:none}

/* bara de sus */
#top{margin-left:calc(var(--side) + 28px);padding:0 32px 0 6px;background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none;border-bottom:0}
#top.umbra{background:color-mix(in srgb,var(--bg) 70%,transparent);-webkit-backdrop-filter:blur(18px) saturate(150%);backdrop-filter:blur(18px) saturate(150%)}
#cmdBtn{height:44px;border-radius:99px;padding:0 8px 0 16px;color:var(--ink2);min-width:260px}
#cmdBtn:hover{color:var(--ink);border-color:var(--line)}
#cmdBtn kbd{border-radius:8px;background:var(--sunk)}
main{margin-left:calc(var(--side) + 28px);padding:4px 32px 90px 6px}

/* butoane, câmpuri, etichete */
.btn{height:42px;padding:0 18px;border-radius:99px;background:var(--act);color:var(--onact);transition:background-color .16s var(--ease),transform .16s var(--ease)}
.btn:hover{background:var(--act2);color:var(--onact)}
.btn:active{transform:scale(.97);transition-duration:.1s}
:root:not([data-tema="intunecat"]) .btn:not(.sec):not(.ghost):not(.rosu){box-shadow:inset 0 0 0 1px rgba(6,18,11,.16)}
.btn.sec{background:var(--sunk);color:var(--ink);border:1px solid var(--line)}
.btn.sec:hover{background:color-mix(in srgb,var(--ink) 10%,transparent);color:var(--ink)}
.btn.ghost:hover{background:var(--sunk)}
.btn.mic{height:34px;border-radius:99px;padding:0 13px}
input,select,textarea{background:var(--inp);border-color:var(--line);border-radius:14px}
input:focus,select:focus,textarea:focus{border-color:var(--moss);box-shadow:0 0 0 3px var(--mossbg)}
select option{background:var(--surface);color:var(--ink)}
.camp-cautare input{height:42px;border-radius:99px}
.pill{height:26px;padding:0 10px;border-radius:99px;font-size:12.5px}
.nota{border-radius:18px;border:1px solid color-mix(in srgb,var(--blue) 22%,transparent)}
.nota.warn{border-color:color-mix(in srgb,var(--amber) 25%,transparent)}
.filtre button{height:36px;border-radius:99px;background:var(--glass);border:1px solid var(--glass-brd);color:var(--ink2)}
.filtre button:hover{color:var(--ink);border-color:var(--line)}
.filtre button.activ{background:var(--nav-act-bg);color:var(--nav-act-c);border-color:transparent}
.taburi,.seg{background:var(--sunk);border-radius:99px}
.taburi button,.seg button{border-radius:99px}
.taburi button[aria-selected="true"],.seg button.activ{background:var(--nav-act-bg);color:var(--nav-act-c);box-shadow:none}
.tabs button.activ::after{background:var(--sc,var(--moss))}

/* Azi: cifrele mari, fiecare cu culoarea ei */
.rezumat{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;border:0;background:none;overflow:visible;border-radius:0}
.rezumat a{border-radius:24px;padding:20px 22px;border-right:1px solid var(--glass-brd);transition:transform .2s var(--ease)}
.rezumat a:last-child{border-right:1px solid var(--glass-brd)}
.rezumat a:hover{transform:translateY(-2px);background:var(--glass)}
.rezumat a:active{transform:scale(.97)}
.rezumat b{font-size:44px;letter-spacing:-.045em;line-height:1;margin-bottom:8px;color:var(--ink3)}
.rezumat a:nth-child(1) b{color:var(--s-lucru)}
.rezumat a.hot b{color:var(--rust)}.rezumat a.warn b{color:var(--s-acte)}.rezumat a:nth-child(4).warn b{color:var(--s-unelte)}
.rezumat span{font-size:14px}
.rb{border-radius:var(--r3);padding:22px 22px 16px}
.rb-zile div{border-left-color:var(--line2)}
.rb-zile div.we{background:var(--sunk)}
.rb-azi{background:var(--s-lucru);width:2px}
.rb-azi::after{color:var(--s-lucru)}
.mk{border-radius:99px;background:color-mix(in srgb,var(--s-lucru) 18%,transparent);color:var(--ink)}
.mk.auto{background:color-mix(in srgb,var(--s-acte) 20%,transparent);color:var(--ink);box-shadow:inset 3px 0 0 var(--s-acte)}
.mk.urg{background:var(--rustbg);color:var(--ink);box-shadow:inset 3px 0 0 var(--rust)}
.rb-leg i{background:var(--s-lucru)}.rb-leg i.auto{background:var(--s-acte)}
.rb-intarz button{border-radius:12px}

/* liste și tabele */
.lista{overflow:hidden}
.rt{border-top-color:var(--line2);min-height:54px}
.rt:hover{background:var(--sunk)}
.rt .chk{border-color:var(--line);background:transparent}
.rt.facut .chk{background:var(--moss);border-color:var(--moss);color:var(--onmoss)}
th{background:var(--surface2);color:var(--ink3);border-bottom-color:var(--line2)}
td{border-bottom-color:var(--line2)}
tbody tr:hover td,tr.rand-fisa:hover td{background:var(--sunk)}
tfoot tr.tot td{background:var(--surface2);border-top-color:var(--line)}
.bifa-t.da{color:var(--onmoss)}
.kpi-c{border-radius:24px;padding:20px 22px}
.kpi-c b{font-size:clamp(22px,2.1vw,30px);letter-spacing:-.035em;color:var(--sc,var(--ink));overflow-wrap:anywhere}
.kpi-c:hover{background:var(--glass)}
.ct-lista{box-shadow:var(--glass-hi),var(--glass-sh)}
.ct-rand:hover{background:var(--sunk)}
.ct-rand b.bun{color:var(--s-lucru)}
.auto-c{border-radius:24px}.auto-c .ic{border-radius:14px;background:color-mix(in srgb,var(--s-acte) 18%,transparent);color:var(--s-acte)}
.firma{border-radius:24px}
.firma .lipsa{border-radius:14px}
.act-p{border-radius:14px;background:var(--sunk)}
.act-p.rau{background:var(--rustbg)}.act-p.curand{background:var(--amberbg)}
.reguli div{border-top-color:var(--line2)}
.reguli b{color:var(--ink)}
.lk .ic{border-radius:12px;background:color-mix(in srgb,var(--sc,var(--s-unelte)) 18%,transparent);color:var(--sc,var(--s-unelte))}
.lk:hover{border-color:var(--line)}
.drop{border:2px dashed var(--line);border-radius:var(--r3)}
.drop .ic{border-radius:16px;background:color-mix(in srgb,var(--s-unelte) 18%,transparent);color:var(--s-unelte)}
.fis{border-radius:99px}

/* link-uri utile: pătrate, iconița colorată după tip, titlul cel mai vizibil */
.lk-gr{margin-top:28px}
.lk-gr h2{display:flex;align-items:center;gap:10px;font-size:17px;margin-bottom:14px}
.lk-gr h2 i{width:10px;height:10px;border-radius:99px;background:var(--sc)}
.lk-gr h2 span{font-size:13px;font-weight:600;color:var(--ink3)}
.plac{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(176px,1fr))}
.pl{position:relative;aspect-ratio:1/1;display:flex;flex-direction:column;justify-content:space-between;gap:10px;padding:18px;border-radius:26px;text-decoration:none;color:var(--ink);transition:transform .2s var(--ease),border-color .2s var(--ease)}
.pl:hover{transform:translateY(-3px);color:var(--ink);border-color:color-mix(in srgb,var(--sc) 55%,transparent)}
.pl:active{transform:scale(.97)}
.pl .ic{width:54px;height:54px;border-radius:17px;display:grid;place-items:center;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 10px 22px -10px rgba(0,0,0,.45)}
.pl .ic svg{width:26px;height:26px;stroke-width:2}
.pl .ic.foaie{background:linear-gradient(150deg,#3CD884,#0E7D45)}
.pl .ic.dosar{background:linear-gradient(150deg,#62AEFF,#1A5BAA)}
.pl .ic.doc{background:linear-gradient(150deg,#FFD266,#C98200)}
.pl .ic.platf{background:linear-gradient(150deg,#D4FFB0,#6CCB1F);color:#06120B}
.pl .ic.ext{background:linear-gradient(150deg,#5BE9C8,#0B8770)}
.pl .sag{position:absolute;top:18px;right:18px;color:var(--ink3);opacity:.55;transition:opacity .2s var(--ease),transform .2s var(--ease)}
.pl:hover .sag{opacity:1;transform:translate(2px,-2px);color:var(--sc)}
.pl .txt{min-width:0}
.pl b{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-size:16px;font-weight:700;line-height:1.25;letter-spacing:-.01em;color:var(--ink)}
.pl .tip{display:block;margin-top:5px;font-size:12.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* fișa (panoul lateral), paleta, notificări */
#scrim{background:rgba(3,10,6,.5)}
#drawer{background:var(--solid);border-radius:28px 0 0 28px;border-left:1px solid var(--glass-brd)}
:root[data-tema="intunecat"] #drawer{background:linear-gradient(180deg,#12301F,#081A10)}
.dr-cap,.dr-jos,.fr-jos{border-color:var(--line2)}
.fr-jos{background:transparent}
.detalii,.fr-mod{background:var(--sunk);border-color:var(--line2);border-radius:18px}
.compune{background:var(--inp);border-color:var(--line);border-radius:20px}
#paleta{background:rgba(3,10,6,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.pal{background:var(--solid);border-radius:24px;border:1px solid var(--glass-brd)}
:root[data-tema="intunecat"] .pal{background:linear-gradient(180deg,#12301F,#0A1D12)}
.pal-l button{border-radius:14px}
.pal-l button.sel{background:var(--sunk)}
.toast{border-radius:16px;background:var(--nav-act-bg);color:var(--nav-act-c)}
.toast button{color:var(--moss)}
:root[data-tema="intunecat"] .toast button{color:#17773A}
.msg-eu{background:var(--nav-act-bg);color:var(--nav-act-c);border-radius:20px 20px 6px 20px}
.as-ist .lst button{border-radius:14px}
.as-ist .lst button.activ{background:var(--sunk)}
.sugestii button{border-radius:18px}

/* intrarea: același curent, pe toată partea stângă */
.lg-art{background:#06120B}
.lg-art canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.lg-form .btn{height:48px}

/* conversațiile botului (ca WhatsApp: persoanele în stânga, firul în dreapta) */
.bc-cadru{display:grid;grid-template-columns:320px minmax(0,1fr);height:calc(100vh - var(--top) - 150px);min-height:520px;overflow:hidden}
.bc-st{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line2)}
.bc-st .bc-q{padding:12px}
.bc-st .bc-q input{height:42px;border-radius:99px}
.bc-l{flex:1;overflow:auto;padding:0 6px 8px}
.bc-om{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:12px;width:100%;padding:10px 10px;border-radius:18px;transition:background-color .12s var(--ease)}
.bc-om:hover{background:var(--sunk)}
.bc-om[aria-current="true"]{background:var(--nav-act-bg);color:var(--nav-act-c)}
.bc-om[aria-current="true"] .bc-pv,.bc-om[aria-current="true"] .bc-ora{color:inherit;opacity:.7}
.bc-om:focus-visible{outline:2px solid var(--moss);outline-offset:-2px}
.bc-av{width:42px;height:42px;flex:none;border-radius:99px;display:grid;place-items:center;font-weight:800;font-size:15px;color:#06120B;background:var(--sc)}
.bc-c{flex:1;min-width:0}
.bc-r1{display:flex;align-items:baseline;gap:8px}
.bc-r1 b{flex:1;min-width:0;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bc-ora{font-size:12px;color:var(--ink3);white-space:nowrap;font-variant-numeric:tabular-nums}
.bc-pv{display:block;font-size:13px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.bc-dr{display:flex;flex-direction:column;min-height:0;min-width:0}
.bc-cap{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line2)}
.bc-cap .bc-c b{font-size:16px}
.bc-cap .bc-c span{display:block;font-size:12.5px;color:var(--ink3)}
.bc-inapoi{display:none}
.bc-fir{flex:1;overflow:auto;padding:18px 22px 26px;display:flex;flex-direction:column;gap:6px;background-image:radial-gradient(color-mix(in srgb,var(--ink) 9%,transparent) 1px,transparent 1.2px);background-size:18px 18px}
.bc-zi{align-self:center;margin:12px 0 6px;padding:5px 12px;border-radius:99px;background:var(--surface2);color:var(--ink2);font-size:12.5px;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.bc-m{max-width:min(78%,620px);padding:8px 12px 6px;border-radius:18px;font-size:14.5px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:0 1px 1px rgba(0,0,0,.12)}
.bc-m.in{align-self:flex-start;background:color-mix(in srgb,var(--ink) 7%,var(--surface));border-top-left-radius:6px}
.bc-m.out{align-self:flex-end;background:color-mix(in srgb,var(--s-lucru) 22%,var(--surface));border-top-right-radius:6px}
.bc-m .bc-t{display:block;text-align:right;font-size:11.5px;color:var(--ink3);margin-top:2px;font-variant-numeric:tabular-nums}
.bc-m .bc-la{display:block;margin:0 0 6px;padding:6px 10px;border-radius:10px;border-left:3px solid var(--s-lucru);background:var(--sunk);font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bc-m .bc-fis{display:inline-flex;align-items:center;gap:8px;margin:2px 0 4px;padding:8px 12px;border-radius:12px;background:var(--sunk);font-size:13.5px;font-weight:600;color:var(--ink);text-decoration:none;max-width:100%}
.bc-m .bc-fis span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bc-m .bc-sta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;border:0}
.bc-m .bc-sta .pill{height:22px;font-size:11.5px}
.bc-gol{margin:auto;text-align:center;color:var(--ink2);max-width:340px;padding:24px}
.bc-gol b{display:block;color:var(--ink);font-size:17px;margin-bottom:6px}
.bc-mai{align-self:center;margin:4px 0 10px}

/* tabletă și telefon: ținte de 44 px, meniul se strânge sub „Meniu” */
@media (min-width:1101px){#nav a{height:36px}#nav .gr{padding:10px 12px 4px}}
@media (max-width:1100px){
 #nav a{height:44px}
 .btn{height:44px}.btn.mic{height:40px}
 .ib{width:44px;height:44px}
 .filtre button{height:44px}
 .rezumat{grid-template-columns:repeat(2,minmax(0,1fr))}
 .bc-cadru{grid-template-columns:280px minmax(0,1fr)}
}
@media (max-width:860px){
 #side{top:10px;left:10px;right:10px;bottom:auto;width:auto;border-radius:24px;padding:6px;transform:none;visibility:visible;transition:none;max-height:calc(100vh - 20px);max-height:calc(100dvh - 20px);box-shadow:var(--glass-hi),var(--glass-sh)}
 #side.deschis{transform:none}
 .side-sus{padding:2px 2px 2px 12px}
 #sideCorp{display:none}
 #side.deschis #sideCorp{display:flex;overflow:auto;padding-top:4px}
 #burger{display:inline-flex;align-items:center;height:44px;padding:0 16px;border:0;border-radius:99px;background:var(--sunk);color:var(--ink);font-weight:600;font-size:15px;cursor:pointer;width:auto}

   Mișcarea (după skill-urile de motion din memorie): hover sub 120 ms, apăsare .97 în 120 ms, carduri 200-320 ms ease-out,
   schimbarea paginii 300 ms (MD3 „emphasized” la intrare, „accelerate” la ieșire), cascadă de 30 ms pe primele 10 elemente,

.btn,.ib,.filtre button,.taburi button,.seg button{transition:transform 160ms var(--e-in),background-color 120ms linear,color 120ms linear,border-color 120ms linear}

  if (S.rol === 'asociat') { h += '<div class="sectiune"><h2>Conturile</h2><div class="tabwrap" style="max-width:820px"><table><thead><tr><th>Cont</th><th>Acces</th><th>Stare</th><th>Setată</th><th>Ultima intrare</th></tr></thead><tbody id="kB"><tr><td colspan="5"><div class="sk" style="height:14px"></div></td></tr></tbody></table></div></div><div class="sectiune">' + form('fTam', 'Parola contului Tamara', 'Schimbă parola Tamarei') + '</div>'; }
  m.innerHTML = h;
  var verif = function (a, b) { if (a.trim().length < 8) { toast('Parola are minimum 8 caractere.', { err: true }); return false; } if (a !== b) { toast('Parolele nu se potrivesc.', { err: true }); return false; } return true; };
  $('fMea').onsubmit = async function (ev) { ev.preventDefault(); var a = $('fMea1').value, b = $('fMea2').value; if (!verif(a, b)) return; try { await api('parola_proprie', { parola: a }); toast('Parola e schimbată. Intră din nou cu ea.'); setTimeout(function () { iesire(true); }, 1500); } catch (e) { toast(e.message, { err: true }); } };
  if (S.rol !== 'asociat') return;
  $('fTam').onsubmit = async function (ev) { ev.preventDefault(); var a = $('fTam1').value, b = $('fTam2').value; if (!verif(a, b)) return; try { await api('parola_proprie', { id: 'tamara', parola: a }); $('fTam1').value = ''; $('fTam2').value = ''; toast('Parola Tamarei e schimbată.'); mergi('chei', true); } catch (e) { toast(e.message, { err: true }); } };
  try { var d = await api('chei'); $('kB').innerHTML = d.chei.map(function (k) { return '<tr><td><b>' + esc(k.nume) + '</b></td><td>' + (k.rol === 'asociat' ? 'acces complet' : 'acces Tamara') + '</td><td>' + (k.activ ? '<span class="pill ok">activ</span>' : '<span class="pill hot">oprit</span>') + '</td><td>' + esc(k.creat) + '</td><td>' + esc(k.ultima || '-') + '</td></tr>'; }).join(''); } catch (e) { $('kB').innerHTML = '<tr><td colspan="5" class="err">' + esc(e.message) + '</td></tr>'; }
};

// ---------- paleta de comenzi (Ctrl K) ----------
function deschidePaleta() {
  if ($('paleta')) return;
  var p = document.createElement('div'); p.id = 'paleta';
  p.innerHTML = '<div class="pal" role="dialog" aria-label="Caută sau sari la"><div class="pal-in">' + ic('cauta') + '<input id="palQ" placeholder="Caută o pagină, un task sau o acțiune" aria-label="Caută" autocomplete="off"><kbd class="mic-t">Esc</kbd></div><div class="pal-l" id="palL"></div></div>';
  document.body.appendChild(p);
  p.onclick = function (e) { if (e.target === p) inchidePaleta(); };
  var tk = (citesteC('taskuri_deschise') || citesteC('taskuri_toate') || { d: { taskuri: [] } }).d.taskuri;
  var actiuni = [
    { g: 'Acțiuni', t: 'Task nou', i: 'plus', f: function () { mergi('taskuri'); setTimeout(formTaskNou, 60); } },
    { g: 'Acțiuni', t: 'Întreabă-l pe Claudiu', i: 'asistent', f: function () { location.hash = 'asistent'; } },
    { g: 'Acțiuni', t: 'Urcă un document', i: 'urca', f: function () { location.hash = 'urca'; } },
    { g: 'Acțiuni', t: 'Schimbă tema', i: 'luna', f: function () { $('btnTema').click(); } },
    { g: 'Acțiuni', t: 'Ieșire', i: 'iesire', f: function () { iesire(); } }
  ];
  var pagini = NAV.filter(function (n) { return n.p; }).map(function (n) { return { g: 'Pagini', t: n.t, i: n.i, f: function () { location.hash = n.p; } }; });
  if (S.rol === 'asociat') pagini.push({ g: 'Pagini', t: 'Conversațiile botului', i: 'bot', f: function () { location.hash = 'botconv'; } });
  pagini.push({ g: 'Pagini', t: 'Contracte (platforma TEG Contracte)', i: 'contracte', f: function () { window.open(LINK_CONTRACTE, '_blank', 'noopener'); } });
  var taskuri = tk.map(function (t) { return { g: 'Taskuri', t: t.Titlu, s: t.ID, i: 'taskuri', f: function () { deschideTask(t.ID); } }; });
  var sel = 0, rez = [];
  var des = function () {
    var q = $('palQ').value;
    rez = pagini.concat(actiuni).filter(function (x) { return filtreazaText(q, x.t); }).concat(q ? taskuri.filter(function (x) { return filtreazaText(q, x.t + ' ' + x.s); }).slice(0, 8) : []);
    sel = Math.min(sel, Math.max(0, rez.length - 1));
    var g = '', h = '';
    rez.forEach(function (x, k) { if (x.g !== g) { g = x.g; h += '<div class="gr">' + esc(g) + '</div>'; } h += '<button type="button" data-k="' + k + '" class="' + (k === sel ? 'sel' : '') + '">' + ic(x.i) + '<span>' + esc(x.t) + '</span>' + (x.s ? '<span class="s">' + esc(x.s) + '</span>' : '') + '</button>'; });
    $('palL').innerHTML = h || '<div class="nimic">Nimic găsit.</div>';
    $('palL').querySelectorAll('button').forEach(function (b) { b.onclick = function () { executa(Number(b.dataset.k)); }; b.onmousemove = function () { if (sel !== Number(b.dataset.k)) { sel = Number(b.dataset.k); des(); } }; });
    var s = $('palL').querySelector('.sel'); if (s) s.scrollIntoView({ block: 'nearest' });
  };
  var executa = function (k) { var x = rez[k]; if (!x) return; inchidePaleta(); x.f(); };
  $('palQ').oninput = function () { sel = 0; des(); };
  $('palQ').onkeydown = function (e) { if (e.key === 'ArrowDown') { e.preventDefault(); sel = Math.min(rez.length - 1, sel + 1); des(); } else if (e.key === 'ArrowUp') { e.preventDefault(); sel = Math.max(0, sel - 1); des(); } else if (e.key === 'Enter') { e.preventDefault(); executa(sel); } };
  des(); $('palQ').focus();
}
function inchidePaleta() { var p = $('paleta'); if (p) p.remove(); }

// ---------- versiunea nouă: dacă pe server e alta decât cea din memoria browserului, pagina se reîncarcă o dată ----------
(function () {
  try { if (sessionStorage.getItem('eco_ver_inc') === VER) return; } catch (e) { }
  fetch(location.pathname + '?_v=' + Date.now(), { cache: 'no-store', credentials: 'omit' }).then(function (r) { return r.text(); }).then(function (t) {
    var m = /var VER = '([^']+)'/.exec(t);
    if (m && m[1] !== VER) { try { if (sessionStorage.getItem('eco_ver_inc') === m[1]) return; sessionStorage.setItem('eco_ver_inc', m[1]); } catch (e) { } location.replace(location.pathname + '?v=' + encodeURIComponent(m[1]) + location.hash); }
  }).catch(function () { });
})();
