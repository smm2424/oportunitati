<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-ROLzNXCOFNGB9pmVI3ePpLsQ/uuziRYIIov2G9eLn0s='; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src https://script.google.com https://script.googleusercontent.com; img-src 'self' data:; base-uri 'none'; form-action 'none'; manifest-src 'none'">
<meta name="theme-color" content="#EDF1EC">
<title>Ecosistem TEG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
 --bg:#EDF1EC;--surface:#FFFFFF;--surface2:#F4F7F3;--sunk:#E4EAE3;--ink:#14231A;--ink2:#4E5F54;--ink3:#7A8A7F;--line:#D5DDD4;--line2:#E6ECE5;
 --moss:#17773A;--moss2:#0F5E2C;--mossbg:#E2F1E6;--lime:#9BFF4F;--amber:#9A6700;--amberbg:#FFF2CF;--rust:#B23A10;--rustbg:#FCE7DE;--blue:#0A4A7C;--bluebg:#E1ECF6;
 --onmoss:#fff;--sh:0 1px 2px rgba(20,35,26,.06),0 8px 24px -12px rgba(20,35,26,.18);--sh2:0 24px 60px -20px rgba(10,25,15,.45);
 --r1:8px;--r2:12px;--r3:18px;--ease:cubic-bezier(.2,.8,.2,1);--side:244px;--top:60px;
 color-scheme:light;
}
:root[data-tema="intunecat"]{
 --bg:#0C1410;--surface:#121C16;--surface2:#16221B;--sunk:#0A110D;--ink:#E3ECE5;--ink2:#A3B5A8;--ink3:#73867A;--line:#243429;--line2:#1C2A21;
 --moss:#45C46B;--moss2:#6BDA89;--mossbg:#173322;--amber:#F2C14E;--amberbg:#2F2610;--rust:#FF8A5C;--rustbg:#3A1C12;--blue:#7DB7E8;--bluebg:#11263A;
 --onmoss:#06120A;--sh:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6);--sh2:0 24px 60px -20px rgba(0,0,0,.8);
 color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
a{color:var(--moss);text-underline-offset:2px}
a:hover{color:var(--moss2)}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.01em;line-height:1.2}
h1{font-size:30px;font-weight:800;letter-spacing:-.025em}
h2{font-size:19px}
h3{font-size:15px}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--moss);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* butoane și câmpuri */
.btn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 16px;border-radius:10px;border:1px solid transparent;background:var(--moss);color:var(--onmoss);font-weight:600;cursor:pointer;white-space:nowrap;transition:background .15s,transform .1s,box-shadow .15s;text-decoration:none}
.btn:hover{background:var(--moss2);color:var(--onmoss)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.55;cursor:default}
.btn.sec{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.sec:hover{border-color:var(--ink3);background:var(--surface2)}
.btn.ghost{background:transparent;color:var(--ink2);border-color:transparent}
.btn.ghost:hover{background:var(--sunk);color:var(--ink)}
.btn.rosu{background:transparent;color:var(--rust);border-color:transparent}
.btn.rosu:hover{background:var(--rustbg)}
.btn.mic{height:32px;padding:0 12px;font-size:13.5px;border-radius:8px}
.ib{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:10px;border:0;background:transparent;color:var(--ink2);cursor:pointer;transition:background .15s,color .15s}
.ib:hover{background:var(--sunk);color:var(--ink)}
input,select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;transition:border-color .15s,box-shadow .15s}
textarea{resize:vertical;line-height:1.45}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--moss);box-shadow:0 0 0 3px var(--mossbg)}
label{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin:14px 0 6px}
.camp-cautare{position:relative;max-width:280px;width:100%}
.camp-cautare svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink3)}
.camp-cautare input{padding-left:34px;height:38px}

/* etichete de stare */
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--sunk);color:var(--ink2);white-space:nowrap}
.pill.ok{background:var(--mossbg);color:var(--moss)}
.pill.warn{background:var(--amberbg);color:var(--amber)}
.pill.hot{background:var(--rustbg);color:var(--rust)}
.pill.info{background:var(--bluebg);color:var(--blue)}
.pill .d{width:6px;height:6px;border-radius:50%;background:currentColor}
.id{font-size:12px;font-weight:600;color:var(--ink3);letter-spacing:.02em}
.muted{color:var(--ink2)}
.mic-t{font-size:13px;color:var(--ink3)}

/* intrarea */
#login{position:fixed;inset:0;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(360px,.85fr);background:var(--bg);z-index:50}
.lg-art{position:relative;overflow:hidden;background:#0E2417;color:#EAF5EC;display:flex;flex-direction:column;justify-content:space-between;padding:44px 52px}
.lg-art svg.contur{position:absolute;inset:-10%;width:120%;height:120%;opacity:.55}
.lg-art .marca{position:relative;font-weight:800;font-size:clamp(88px,13vw,190px);line-height:.85;letter-spacing:-.06em;color:#EAF5EC}
.lg-art .marca span{display:block;font-size:.2em;letter-spacing:-.01em;font-weight:600;color:var(--lime);margin-top:18px}
.lg-art .jos{position:relative;max-width:420px;color:#B8D0BE;font-size:15.5px}
.lg-form{display:flex;align-items:center;justify-content:center;padding:32px}
.lg-form form{width:100%;max-width:360px}
.lg-form h1{margin-bottom:8px}
.lg-form .btn{width:100%;justify-content:center;height:44px;margin-top:18px}
#loginErr{min-height:22px;margin-top:12px;color:var(--rust);font-size:14px}
.scutura{animation:scutura .4s var(--ease)}
@keyframes scutura{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}

/* cadrul aplicației */
#app{min-height:100vh}
#side{position:fixed;inset:0 auto 0 0;width:var(--side);background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:30;transition:transform .25s var(--ease)}
.brand{display:flex;align-items:baseline;gap:8px;padding:20px 20px 16px;text-decoration:none;color:var(--ink)}
.brand b{font-size:22px;font-weight:800;letter-spacing:-.04em}
.brand i{font-style:normal;font-size:13.5px;color:var(--ink2);font-weight:500}
.brand .pct{width:8px;height:8px;border-radius:2px;background:var(--lime);box-shadow:0 0 0 1px rgba(20,35,26,.25);align-self:center}
#nav{flex:1;overflow:auto;padding:4px 12px 12px}
#nav .gr{font-size:12px;color:var(--ink3);font-weight:600;padding:14px 10px 6px}
#nav a{position:relative;display:flex;align-items:center;gap:11px;height:38px;padding:0 10px;border-radius:9px;color:var(--ink2);text-decoration:none;font-weight:500;cursor:pointer;transition:background .15s,color .15s}
#nav a:hover{background:var(--surface2);color:var(--ink)}
#nav a.activ{background:var(--mossbg);color:var(--moss);font-weight:600}
#nav a.activ::before{content:"";position:absolute;left:-12px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--moss)}
#nav a .nr{margin-left:auto;font-size:12px;font-weight:700;min-width:22px;height:20px;padding:0 6px;border-radius:999px;display:grid;place-items:center;background:var(--sunk);color:var(--ink2)}
#nav a .nr.hot{background:var(--rustbg);color:var(--rust)}
#nav a .ext{margin-left:auto;color:var(--ink3)}
.side-jos{border-top:1px solid var(--line2);padding:12px;display:flex;align-items:center;gap:10px}
.av{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:14px;background:var(--ink);color:var(--bg);flex:none}
.side-jos .cine{flex:1;min-width:0;line-height:1.25}
.side-jos .cine b{display:block;font-size:14px}
.side-jos .cine span{font-size:12.5px;color:var(--ink3);white-space:nowrap}
#top{position:sticky;top:0;z-index:20;height:var(--top);margin-left:var(--side);display:flex;align-items:center;gap:12px;padding:0 28px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid transparent;transition:border-color .2s}
#top.umbra{border-bottom-color:var(--line)}
#top .titlu{font-weight:700;font-size:15px;opacity:0;transition:opacity .2s}
#top.umbra .titlu{opacity:1}
#top .sp{flex:1}
#cmdBtn{display:inline-flex;align-items:center;gap:10px;height:36px;padding:0 10px 0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink3);cursor:pointer;min-width:250px;font-size:14px}
#cmdBtn:hover{border-color:var(--ink3);color:var(--ink2)}
#cmdBtn kbd{margin-left:auto;font:600 11.5px/1 inherit;padding:4px 6px;border-radius:6px;background:var(--sunk);color:var(--ink2)}
#sync{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--ink3);white-space:nowrap}
#sync .rot{animation:rot 1s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
#burger{display:none}
main{margin-left:var(--side);padding:12px 40px 90px;max-width:1320px}
.pagina{animation:intra .28s var(--ease)}
@keyframes intra{from{opacity:0;transform:translateY(6px)}}
.cap{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:14px 0 24px}
.cap p{margin-top:6px;color:var(--ink2);max-width:72ch}
.cap .act{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sectiune{margin-top:34px}
.sectiune>h2{margin-bottom:12px;display:flex;align-items:center;gap:10px}
.sectiune>h2 .nr{font-size:13px;color:var(--ink3);font-weight:600}
.panou{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2)}
.panou.pad{padding:20px}
.coloane{display:grid;gap:20px;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
.gol{padding:34px 20px;text-align:center;color:var(--ink2)}
.gol b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.nota{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--r1);background:var(--bluebg);color:var(--blue);font-size:14px}
.nota.warn{background:var(--amberbg);color:var(--amber)}

/* schelet de încărcare */
.sk{background:linear-gradient(90deg,var(--sunk) 0,var(--surface2) 40%,var(--sunk) 80%);background-size:300% 100%;animation:sk 1.3s ease-in-out infinite;border-radius:8px}
@keyframes sk{from{background-position:100% 0}to{background-position:0 0}}

/* Azi */
.salut h1{font-size:clamp(30px,3.4vw,40px)}
.salut .zi{color:var(--ink2);margin-top:6px;font-size:16px}
.rezumat{display:flex;flex-wrap:wrap;margin:22px 0 0;border:1px solid var(--line);border-radius:var(--r2);background:var(--surface);overflow:hidden}
.rezumat a{flex:1 1 160px;padding:16px 20px;text-decoration:none;color:var(--ink);border-right:1px solid var(--line2);transition:background .15s}
.rezumat a:last-child{border-right:0}
.rezumat a:hover{background:var(--surface2)}
.rezumat b{display:block;font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.rezumat span{font-size:13.5px;color:var(--ink2)}
.rezumat a.hot b{color:var(--rust)}.rezumat a.warn b{color:var(--amber)}

/* panglica de termene: momentul memorabil al paginii */
.rb{overflow:hidden;margin-top:20px;padding:20px 20px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r3)}
.rb-cap{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:30px}
.rb-leg{display:flex;gap:14px;font-size:13px;color:var(--ink2)}
.rb-leg span{display:inline-flex;align-items:center;gap:6px}
.rb-leg i{width:10px;height:10px;border-radius:3px;background:var(--moss)}
.rb-leg i.auto{background:var(--amber)}
.rb-leg i.urg{background:var(--rust)}
.rb-corp{display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px}
.rb-intarz{min-width:0;border-right:1px dashed var(--line);padding-right:14px}
.rb-intarz b{display:block;font-size:34px;font-weight:800;letter-spacing:-.04em;line-height:1;color:var(--rust)}
.rb-intarz b.zero{color:var(--ink3)}
.rb-intarz span{font-size:13px;color:var(--ink2)}
.rb-intarz button{display:block;width:100%;text-align:left;margin-top:8px;padding:6px 8px;border:0;border-radius:7px;background:var(--rustbg);color:var(--rust);font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rb-pista{position:relative;min-height:150px}
.rb-zile{position:absolute;inset:0;display:grid;grid-template-columns:repeat(31,1fr)}
.rb-zile div{border-left:1px solid var(--line2);position:relative}
.rb-zile div.we{background:var(--surface2)}
.rb-zile div.luni{border-left-color:var(--line)}
.rb-zile em{position:absolute;bottom:-2px;left:4px;font-style:normal;font-size:11.5px;color:var(--ink3);white-space:nowrap}
.rb-azi{position:absolute;top:-6px;bottom:18px;left:0;width:2px;background:var(--ink);transform-origin:top}
.rb-azi::after{content:"azi";position:absolute;top:-16px;left:-4px;font-size:11.5px;font-weight:700;color:var(--ink)}
.mk{position:absolute;height:26px;line-height:26px;max-width:190px;display:block;padding:0 9px 0 10px;text-align:left;border-radius:7px;border:0;background:var(--mossbg);color:var(--moss);font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:inset 3px 0 0 var(--moss);transition:transform .15s var(--ease),box-shadow .15s}
.mk:hover,.mk:focus-visible{transform:translateY(-2px);z-index:2;max-width:none}
.mk.auto{background:var(--amberbg);color:var(--amber);box-shadow:inset 3px 0 0 var(--amber)}
.mk.urg{background:var(--rustbg);color:var(--rust);box-shadow:inset 3px 0 0 var(--rust)}
.rb.anim .rb-azi{animation:creste .7s var(--ease) both}
.rb.anim .mk{animation:cade .45s var(--ease) both;animation-delay:calc(.35s + var(--k,0) * 45ms)}
@keyframes creste{from{transform:scaleY(0)}}
@keyframes cade{from{opacity:0;transform:translateY(-10px)}}

/* liste de taskuri */
.filtre{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.filtre button{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink2);font-size:13.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:all .15s}
.filtre button span{font-size:12px;color:var(--ink3)}
.filtre button:hover{border-color:var(--ink3)}
.filtre button.activ{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.filtre button.activ span{color:inherit;opacity:.7}
.grup{margin-bottom:22px}
.grup h3{font-size:13.5px;color:var(--ink2);margin:0 0 8px 4px;display:flex;gap:8px;align-items:center}
.grup h3.hot{color:var(--rust)}
.lista{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);overflow:hidden}
.rt{display:flex;align-items:center;gap:14px;padding:12px 16px;border-top:1px solid var(--line2);cursor:pointer;transition:background .12s}
.rt:first-child{border-top:0}
.rt:hover{background:var(--surface2)}
.rt .chk{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:var(--surface);flex:none;cursor:pointer;display:grid;place-items:center;color:transparent;transition:all .15s}
.rt .chk:hover{border-color:var(--moss);color:var(--moss)}
.rt .chk svg{width:13px;height:13px;stroke-width:3}
.rt .corp{flex:1;min-width:0}
.rt .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt .m{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--ink3);margin-top:2px}
.rt .urg{color:var(--rust);font-weight:600}
.rt.facut .t{text-decoration:line-through;color:var(--ink3)}
.rt.facut .chk{background:var(--moss);border-color:var(--moss);color:#fff;animation:bifa .35s var(--ease)}
@keyframes bifa{40%{transform:scale(1.25)}}

/* tabele */
.tabwrap{overflow:auto;max-height:72vh;border:1px solid var(--line);border-radius:var(--r2);background:var(--surface)}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}
th{position:sticky;top:0;z-index:1;background:var(--surface2);text-align:left;font-size:12.5px;font-weight:600;color:var(--ink2);padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line2);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr{transition:background .12s}
tbody tr:hover td{background:var(--surface2)}
td.nr,th.nr{text-align:right;white-space:nowrap}
table.nw td{white-space:nowrap}

/* firme */
.firme{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}
.firma{padding:18px 18px 14px}
.firma .fc{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:10px}
.firma ul{list-style:none;margin:0;padding:0}
.firma li{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:6px 0;border-top:1px solid var(--line2);font-size:14px}
.firma li:first-child{border-top:0}
.firma li a{font-weight:600;text-decoration:none}
.firma li a:hover{text-decoration:underline}
.firma .lipsa{margin-top:10px;padding:10px 12px;border-radius:var(--r1);background:var(--rustbg);color:var(--rust);font-size:13.5px}
.firma.are-lipsa{box-shadow:inset 0 3px 0 var(--rust)}

/* link-uri */
.linkuri{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.lk{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r2);border:1px solid var(--line);background:var(--surface);text-decoration:none;color:var(--ink);transition:border-color .15s,transform .15s var(--ease)}
.lk:hover{border-color:var(--moss);color:var(--ink);transform:translateY(-1px)}
.lk .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--mossbg);color:var(--moss);flex:none}
.lk b{display:block;font-weight:600}
.lk span{font-size:12.5px;color:var(--ink3)}

/* urcă */
.drop{display:grid;place-items:center;text-align:center;gap:8px;padding:40px 20px;border:2px dashed var(--line);border-radius:var(--r3);background:var(--surface);cursor:pointer;transition:border-color .15s,background .15s}
.drop:hover,.drop.peste{border-color:var(--moss);background:var(--mossbg)}
.drop .ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--mossbg);color:var(--moss)}
.fis{display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border-radius:8px;background:var(--sunk);font-size:13.5px;font-weight:600}
.fis button{border:0;background:none;cursor:pointer;color:var(--ink3);padding:0;display:grid}

/* fișa taskului (panou lateral) */
#scrim{position:fixed;inset:0;background:rgba(8,18,12,.38);opacity:0;pointer-events:none;transition:opacity .25s;z-index:39}
#scrim.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(600px,100%);background:var(--surface);box-shadow:var(--sh2);transform:translateX(104%);transition:transform .32s var(--ease);z-index:40;display:flex;flex-direction:column}
#drawer.deschis{transform:none}
.dr-cap{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line2)}
.dr-cap .sp{flex:1}
.dr-corp{flex:1;overflow:auto;padding:22px 24px 30px}
.dr-corp h2{font-size:22px;letter-spacing:-.02em;margin-bottom:14px}
.meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 18px;margin:0 0 18px;padding:0}
.meta div{min-width:0}
.meta dt{font-size:12.5px;color:var(--ink3);font-weight:600}
.meta dd{margin:2px 0 0;font-weight:500;overflow-wrap:anywhere}
.seg{display:inline-flex;padding:3px;border-radius:11px;background:var(--sunk);gap:2px;flex-wrap:wrap}
.seg button{height:32px;padding:0 13px;border:0;border-radius:8px;background:transparent;color:var(--ink2);font-weight:600;font-size:13.5px;cursor:pointer;transition:background .15s,color .15s}
.seg button:hover{color:var(--ink)}
.seg button.activ{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.detalii{white-space:pre-wrap;padding:14px 16px;border-radius:var(--r2);background:var(--surface2);border:1px solid var(--line2);margin:16px 0 4px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:26px 0 16px}
.tabs button{position:relative;height:40px;padding:0 12px;border:0;background:none;color:var(--ink2);font-weight:600;cursor:pointer}
.tabs button.activ{color:var(--ink)}
.tabs button.activ::after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:2px;border-radius:2px;background:var(--moss)}
.fir{position:relative;padding:0 0 16px 22px}
.fir::before{content:"";position:absolute;left:5px;top:8px;bottom:-2px;width:2px;background:var(--line2)}
.fir:last-child::before{display:none}
.fir::after{content:"";position:absolute;left:1px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--ink3)}
.fir.fn::after{border-color:var(--moss);background:var(--moss)}
.fir .c{font-size:12.5px;color:var(--ink3)}
.fir .c b{color:var(--ink2)}
.fir .x{white-space:pre-wrap;margin-top:2px}
.compune{margin-top:8px;border:1px solid var(--line);border-radius:var(--r2);background:var(--surface);transition:border-color .15s,box-shadow .15s}
.compune:focus-within{border-color:var(--moss);box-shadow:0 0 0 3px var(--mossbg)}
.compune textarea{border:0;box-shadow:none;background:transparent;resize:none;min-height:64px;max-height:240px}
.compune textarea:focus{box-shadow:none}
.compune .bara{display:flex;align-items:center;gap:8px;padding:6px 8px 8px;flex-wrap:wrap}
.compune .bara .sp{flex:1}
.dr-jos{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 18px;border-top:1px solid var(--line2)}

/* conversații cu Claude */
.chat{display:flex;flex-direction:column;gap:14px}
.msg-eu{align-self:flex-end;max-width:84%;padding:10px 14px;border-radius:14px 14px 4px 14px;background:var(--ink);color:var(--bg);white-space:pre-wrap;overflow-wrap:anywhere}
.msg-ai{max-width:100%;overflow-wrap:anywhere}
.msg-ai p{margin:6px 0}
.msg-ai ul,.msg-ai ol{margin:6px 0;padding-left:22px}
.msg-ai li{margin:3px 0}
.msg-ai h4{font-size:15px;margin:14px 0 4px}
.msg-ai code{font-size:.92em;padding:1px 5px;border-radius:5px;background:var(--sunk)}
.msg-ai pre{margin:8px 0;padding:12px;border-radius:10px;background:var(--sunk);overflow:auto;font-size:13px}
.msg-ai pre code{padding:0;background:none}
.msg-ai .tabwrap{max-height:none;margin:8px 0}
.msg-ai .dom{font-size:11.5px;color:var(--ink3);margin-left:4px}
.pas{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink3)}
.pas::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ink3)}
.lucreaza{display:inline-flex;align-items:center;gap:10px;font-size:13.5px;color:var(--ink2)}
.puncte{display:inline-flex;gap:4px}
.puncte i{width:6px;height:6px;border-radius:50%;background:var(--moss);animation:punct 1.2s infinite ease-in-out}
.puncte i:nth-child(2){animation-delay:.15s}.puncte i:nth-child(3){animation-delay:.3s}
@keyframes punct{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.err{color:var(--rust)}
.as{display:grid;grid-template-columns:270px minmax(0,1fr);gap:20px;height:calc(100vh - var(--top) - 120px);min-height:480px}
.as-ist{display:flex;flex-direction:column;overflow:hidden}
.as-ist .lst{flex:1;overflow:auto;padding:6px}
.as-ist .lst button{display:block;width:100%;text-align:left;padding:10px 12px;border:0;border-radius:9px;background:none;cursor:pointer;color:var(--ink)}
.as-ist .lst button:hover{background:var(--surface2)}
.as-ist .lst button.activ{background:var(--mossbg)}
.as-ist .lst b{display:block;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.as-ist .lst span{font-size:12px;color:var(--ink3)}
.as-ist .cost{padding:12px 14px;border-top:1px solid var(--line2);font-size:12.5px;color:var(--ink3)}
.as-ist .cost .bara-c{height:5px;border-radius:5px;background:var(--sunk);margin-top:6px;overflow:hidden}
.as-ist .cost .bara-c i{display:block;height:100%;background:var(--moss);border-radius:5px}
.as-main{display:flex;flex-direction:column;overflow:hidden}
.as-chat{flex:1;overflow:auto;padding:24px 28px}
.as-main .compune{margin:0 16px 16px}
.sugestii{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px}
.sugestii button{text-align:left;padding:12px 14px;border-radius:var(--r2);border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:14px;color:var(--ink);transition:border-color .15s,background .15s}
.sugestii button:hover{border-color:var(--moss);background:var(--surface2)}
.as-gol{max-width:560px;margin:8vh auto 0}
.as-gol h2{font-size:24px;letter-spacing:-.02em;margin-bottom:6px}

/* bot */
.reguli{display:grid;grid-template-columns:minmax(0,1fr)}
.reguli div{display:grid;grid-template-columns:220px minmax(0,1fr);gap:20px;padding:14px 20px;border-top:1px solid var(--line2)}
.reguli div:first-child{border-top:0}
.reguli b{font-weight:600}
.reguli p{color:var(--ink2)}

/* paleta de comenzi */
#paleta{position:fixed;inset:0;z-index:60;display:grid;place-items:start center;padding-top:12vh;background:rgba(8,18,12,.38);animation:fade .15s}
@keyframes fade{from{opacity:0}}
.pal{width:min(620px,92vw);background:var(--surface);border-radius:16px;box-shadow:var(--sh2);overflow:hidden;animation:pal .2s var(--ease)}
@keyframes pal{from{opacity:0;transform:translateY(-8px) scale(.98)}}
.pal-in{display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--line2)}
.pal-in input{border:0;box-shadow:none;height:54px;font-size:16px;padding:0;background:transparent}
.pal-in input:focus{box-shadow:none}
.pal-l{max-height:52vh;overflow:auto;padding:6px}
.pal-l .gr{font-size:12px;font-weight:600;color:var(--ink3);padding:10px 10px 4px}
.pal-l button{display:flex;width:100%;align-items:center;gap:12px;padding:10px;border:0;border-radius:9px;background:none;text-align:left;cursor:pointer;color:var(--ink)}
.pal-l button .s{margin-left:auto;font-size:12.5px;color:var(--ink3)}
.pal-l button.sel{background:var(--mossbg)}
.pal-l .nimic{padding:20px;color:var(--ink3);text-align:center}

/* notificări */
#toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:70;align-items:center;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:14px;padding:11px 14px 11px 16px;border-radius:12px;background:var(--ink);color:var(--bg);box-shadow:var(--sh2);font-size:14px;font-weight:500;animation:urca .3s var(--ease)}
.toast.err{background:var(--rust);color:#fff}
.toast button{border:0;background:transparent;color:var(--lime);font-weight:700;cursor:pointer;padding:0}
.toast.pleaca{animation:coboara .25s var(--ease) forwards}
@keyframes urca{from{opacity:0;transform:translateY(12px)}}
@keyframes coboara{to{opacity:0;transform:translateY(12px)}}

/* ecrane mici */
@media (max-width:1100px){.coloane{grid-template-columns:minmax(0,1fr)}.as{grid-template-columns:220px minmax(0,1fr)}}
@media (max-width:860px){
 #login{grid-template-columns:1fr;grid-template-rows:auto 1fr}
 .lg-art{padding:28px;min-height:220px}
 .lg-art .marca{font-size:96px}
 .lg-art .jos{display:none}
 #side{transform:translateX(-102%);box-shadow:var(--sh2)}
 #side.deschis{transform:none}
 #top,main{margin-left:0}
 #top{padding:0 14px}
 #top .titlu{opacity:1}
 #burger{display:inline-grid}
 #cmdBtn{min-width:0;padding:0 10px}
 #cmdBtn .t,#cmdBtn kbd,#sync .t{display:none}
 main{padding:8px 16px 90px}
 h1{font-size:26px}
 .rb-corp{grid-template-columns:1fr}
 .rb-intarz{border-right:0;border-bottom:1px dashed var(--line);padding:0 0 12px}
 .rb-pista{overflow-x:auto}
 .as{grid-template-columns:1fr;height:auto}
 .as-ist{max-height:220px}
 .as-main{height:70vh}
 .sugestii{grid-template-columns:1fr}
 .reguli div{grid-template-columns:1fr;gap:4px}
 .rt .t{white-space:normal}
 .rezumat a{flex:1 1 50%;border-bottom:1px solid var(--line2)}
 .meta{grid-template-columns:1fr 1fr}
 .dr-corp{padding:18px 16px 24px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>

 </header>

</div>

<script>
'use strict';
if (window.top !== window.self) { document.documentElement.innerHTML = ''; throw new Error('încadrat'); }
var API = 'https://script.google.com/macros/s/AKfycbwbmB-2kFQXtYGAWs1skzBr2QVOBTBF8Tc4VcWWpbelzpO6Yssfx1UYxk1mOqLnkpEsAQ/exec';
var S = { sesiune: null };
try { var s0 = JSON.parse(localStorage.getItem('eco_sesiune') || 'null'); if (s0 && s0.sesiune && s0.exp > Date.now()) S = s0; else localStorage.removeItem('eco_sesiune'); } catch (e) { }

// ---------- utilitare ----------
function $(id) { return document.getElementById(id); }

 bot: '<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>',

};
function ic(n) { return '<svg class="i" viewBox="0 0 24 24" aria-hidden="true">' + (IC[n] || '') + '</svg>'; }

function toast(text, opt) {
  opt = opt || {};
  var t = document.createElement('div');
  t.className = 'toast' + (opt.err ? ' err' : '');
  t.innerHTML = '<span>' + esc(text) + '</span>' + (opt.act ? '<button type="button">' + esc(opt.act) + '</button>' : '');

  var gata = function () { if (!t.parentNode) return; t.classList.add('pleaca'); setTimeout(function () { t.remove(); }, 260); };

// ---------- legătura cu serverul ----------
async function api(act, date) {
  var corp = Object.assign({ act: act, sesiune: S.sesiune }, date || {});
  var r;

  catch (e) { throw new Error('Fără legătură cu serverul. Verifică internetul și încearcă din nou.'); }

  if (!j.ok) {
    if (/^SESIUNE/.test(j.eroare || '')) { iesire(true); throw new Error('Sesiunea a expirat. Intră din nou.'); }
    throw new Error(j.eroare || 'Eroare');
  }
  return j;
}

// păstrăm ultima variantă a fiecărei pagini: se afișează instant, apoi se actualizează
function cheieC(k) { return 'eco_c_' + (S.id || S.rol || 'x') + '_' + k; }
function citesteC(k) { try { var v = JSON.parse(localStorage.getItem(cheieC(k)) || 'null'); return v && Date.now() - v.t < 7 * 864e5 ? v : null; } catch (e) { return null; } }
function scrieC(k, d) { try { localStorage.setItem(cheieC(k), JSON.stringify({ t: Date.now(), d: d })); } catch (e) { } }
function golesteC() { try { Object.keys(localStorage).forEach(function (k) { if (k.indexOf('eco_c_') === 0) localStorage.removeItem(k); }); } catch (e) { } }
function ora(t) { return new Date(t).toLocaleTimeString('ro-RO', { hour: '2-digit', minute: '2-digit' }); }
function sync(stare, t) {
  var e = $('sync'); if (!e) return;
  if (stare === 'lucru') e.innerHTML = '<svg class="i rot" viewBox="0 0 24 24" aria-hidden="true">' + IC.refa + '</svg><span class="t">Se actualizează</span>';
  else if (stare === 'eroare') e.innerHTML = '<span class="t err">Date din ' + ora(t) + ', fără legătură</span>';
  else e.innerHTML = '<span class="t">Actualizat la ' + ora(t || Date.now()) + '</span>';
}
var GEN = 0;
async function incarca(m, k, act, args, randeaza, schelet) {
  var g = GEN, c = citesteC(k);
  if (c) { randeaza(c.d, m, true); } else m.innerHTML = schelet || scheletLista();
  sync('lucru');
  try {
    var d = await api(act, args);
    if (g !== GEN) return d;
    scrieC(k, d);
    if (!c || JSON.stringify(c.d) !== JSON.stringify(d)) { var y = window.scrollY; randeaza(d, m, false); window.scrollTo(0, y); }
    sync('ok');
    return d;
  } catch (e) {
    if (g !== GEN) return;
    if (c) { sync('eroare', c.t); toast('Nu am putut actualiza: ' + e.message, { err: true }); } else { sync('ok'); throw e; }
  }

function scheletLista() { var h = '<div class="cap"><div class="sk" style="width:240px;height:34px"></div></div><div class="panou">'; for (var i = 0; i < 6; i++) h += '<div style="padding:16px;border-top:1px solid var(--line2);display:flex;gap:14px;align-items:center"><div class="sk" style="width:22px;height:22px;border-radius:50%"></div><div style="flex:1"><div class="sk" style="height:14px;width:' + (40 + (i * 13) % 45) + '%"></div><div class="sk" style="height:10px;width:24%;margin-top:8px"></div></div><div class="sk" style="width:80px;height:22px;border-radius:99px"></div></div>'; return h + '</div>'; }

// ---------- intrare / ieșire ----------
function iesire(tacut) {
  localStorage.removeItem('eco_sesiune'); golesteC(); S = { sesiune: null };
  clearTimeout(AS.timer); clearTimeout(TC.timer);
  inchide(); $('app').hidden = true; $('login').hidden = false; deseneazaContur();
  if (!tacut) toast('Ai ieșit din cont.');
  setTimeout(function () { $('cheie').focus(); }, 50);
}
$('fLogin').addEventListener('submit', async function (ev) {
  ev.preventDefault();
  var cheie = $('cheie').value; if (!cheie.trim()) return;

// ---------- textul lui Claude: markdown sigur (totul trece prin esc înainte de formatare) ----------
function md(t) {
  var linii = String(t || '').replace(/\r/g, '').split('\n'), out = [], tab = [], lista = null, cod = null;
  function inline(x) {
    var s = esc(x);
    s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
    s = s.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/(^|[\s(])\*([^*\s][^*]*)\*(?=[\s).,;:!?]|$)/g, '$1<i>$2</i>');
    s = s.replace(/\[([^\]]+)\]\((https:\/\/[^)\s"'<>]+)\)/g, function (m0, txt, u) { var uu = urlSigur(u.replace(/&amp;/g, '&')); var dom = domeniu(uu); var cunoscut = /(^|\.)(docs\.google\.com|drive\.google\.com|teg\.ro)$/.test(dom); return cunoscut ? '<a target="_blank" rel="noopener noreferrer" href="' + esc(uu) + '">' + txt + '</a>' : txt + ' <span class="dom">(link extern neverificat: ' + esc(dom) + ')</span>'; });
    return s;
  }
  function golTab() { if (!tab.length) return;
    var r = tab.filter(function (l) { return !/^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)*\|?\s*$/.test(l); });
    out.push('<div class="tabwrap"><table>' + r.map(function (l, k) { var c = l.trim().replace(/^\||\|$/g, '').split('|'); return (k === 0 ? '<thead>' : '') + '<tr>' + c.map(function (x) { return (k ? '<td>' : '<th>') + inline(x.trim()) + (k ? '</td>' : '</th>'); }).join('') + '</tr>' + (k === 0 ? '</thead><tbody>' : ''); }).join('') + '</tbody></table></div>'); tab = []; }
  function golLista() { if (!lista) return; out.push('<' + lista.tag + '>' + lista.el.map(function (x) { return '<li>' + inline(x) + '</li>'; }).join('') + '</' + lista.tag + '>'); lista = null; }
  linii.forEach(function (l) {
    if (cod !== null) { if (/^\s*```/.test(l)) { out.push('<pre><code>' + esc(cod.join('\n')) + '</code></pre>'); cod = null; } else cod.push(l); return; }
    if (/^\s*```/.test(l)) { golTab(); golLista(); cod = []; return; }
    if (/^\s*\|/.test(l)) { golLista(); tab.push(l); return; } golTab();
    var m = /^\s*[-*•] (.*)$/.exec(l); if (m) { if (lista && lista.tag !== 'ul') golLista(); lista = lista || { tag: 'ul', el: [] }; lista.el.push(m[1]); return; }
    m = /^\s*\d+[.)] (.*)$/.exec(l); if (m) { if (lista && lista.tag !== 'ol') golLista(); lista = lista || { tag: 'ol', el: [] }; lista.el.push(m[1]); return; }
    golLista();
    var hh = /^(#{1,4}) (.*)$/.exec(l); if (hh) { out.push('<h4>' + inline(hh[2]) + '</h4>'); return; }
    if (/^\s*(---|\*\*\*)\s*$/.test(l)) { out.push('<hr style="border:0;border-top:1px solid var(--line2);margin:12px 0">'); return; }
    if (l.trim()) out.push('<p>' + inline(l) + '</p>');
  });
  if (cod !== null) out.push('<pre><code>' + esc(cod.join('\n')) + '</code></pre>');
  golTab(); golLista();
  return out.join('');
}
function curataMesaj(t) { t = String(t || ''); var i = t.indexOf('[Mesajul despre acest task:]\n'); if (i >= 0) return t.slice(i + 29); return t.replace(/^\[[^\]]*\]\n(\[Atașamente[^\]]*\]\n)?/, ''); }

    { g: 'Acțiuni', t: 'Schimbă tema', i: 'luna', f: function () { $('btnTema').click(); } },
    { g: 'Acțiuni', t: 'Ieșire', i: 'iesire', f: function () { iesire(); } }
  ];
  var pagini = NAV.filter(function (n) { return n.p; }).map(function (n) { return { g: 'Pagini', t: n.t, i: n.i, f: function () { location.hash = n.p; } }; });
  var taskuri = tk.map(function (t) { return { g: 'Taskuri', t: t.Titlu, s: t.ID, i: 'taskuri', f: function () { deschideTask(t.ID); } }; });
  var sel = 0, rez = [];
  var des = function () {
    var q = $('palQ').value;
    rez = pagini.concat(actiuni).filter(function (x) { return filtreazaText(q, x.t); }).concat(q ? taskuri.filter(function (x) { return filtreazaText(q, x.t + ' ' + x.s); }).slice(0, 8) : []);
    sel = Math.min(sel, Math.max(0, rez.length - 1));
    var g = '', h = '';
    rez.forEach(function (x, k) { if (x.g !== g) { g = x.g; h += '<div class="gr">' + esc(g) + '</div>'; } h += '<button type="button" data-k="' + k + '" class="' + (k === sel ? 'sel' : '') + '">' + ic(x.i) + '<span>' + esc(x.t) + '</span>' + (x.s ? '<span class="s">' + esc(x.s) + '</span>' : '') + '</button>'; });
    $('palL').innerHTML = h || '<div class="nimic">Nimic găsit.</div>';
    $('palL').querySelectorAll('button').forEach(function (b) { b.onclick = function () { executa(Number(b.dataset.k)); }; b.onmousemove = function () { if (sel !== Number(b.dataset.k)) { sel = Number(b.dataset.k); des(); } }; });
    var s = $('palL').querySelector('.sel'); if (s) s.scrollIntoView({ block: 'nearest' });
  };
  var executa = function (k) { var x = rez[k]; if (!x) return; inchidePaleta(); x.f(); };
  $('palQ').oninput = function () { sel = 0; des(); };
  $('palQ').onkeydown = function (e) { if (e.key === 'ArrowDown') { e.preventDefault(); sel = Math.min(rez.length - 1, sel + 1); des(); } else if (e.key === 'ArrowUp') { e.preventDefault(); sel = Math.max(0, sel - 1); des(); } else if (e.key === 'Enter') { e.preventDefault(); executa(sel); } };
  des(); $('palQ').focus();
}
function inchidePaleta() { var p = $('paleta'); if (p) p.remove(); }

// ---------- pornire ----------
if (S.sesiune) porneste(); else { $('login').hidden = false; deseneazaContur(); setTimeout(function () { $('cheie').focus(); }, 50); }
