<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#08110D">
<title>TEG Contracte</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%23C6EB6A'/%3E%3Cpath d='M20 8l7 10h-4l6 8h-5l5 7H11l5-7h-5l6-8h-4z' fill='%230B1A0F'/%3E%3C/svg%3E">
<!--
  Intrarea frumoasă în platforma TEG Contracte (v1.9.1, 28.10.2026 — Sebastian: „un link mai frumos, nu de script Google”).
  Pagina NU conține date: afișează platforma (Apps Script) în interior, iar accesul îl verifică platforma
  (cont Google teg.ro + lista celor 4, la fiecare apel). Pe iPhone / iPad / Safari, unde logarea Google în interior e blocată,
  te duce direct pe pagina Google.
-->
<style>
html,body{margin:0;height:100%;background:#08110D;color:#E6EFE8;font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#08110D}
#intrare{position:fixed;inset:0;display:grid;place-items:center;padding:16px;background:radial-gradient(900px 600px at 80% -10%,rgba(198,235,106,.10),transparent 60%),#08110D;z-index:2;transition:opacity .5s}
#intrare.gata{opacity:0;pointer-events:none}
.c{text-align:center;max-width:420px}
.s{width:56px;height:56px;margin:0 auto 18px;animation:respira 1.6s ease-in-out infinite}
@keyframes respira{50%{transform:scale(.92);opacity:.7}}
h1{margin:0 0 6px;font-size:22px;letter-spacing:-.01em}
p{margin:6px 0;color:#9FB3A7;font-size:14px}
a{color:#C6EB6A;font-weight:600;text-decoration:none}a:hover{text-decoration:underline}
#direct{opacity:0;transition:opacity .4s}#direct.vizibil{opacity:1}
@media (prefers-reduced-motion:reduce){.s{animation:none}}
</style>
</head>
<body>
<div id="intrare" role="status">
  <div class="c">
    <svg class="s" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="12" fill="#C6EB6A"/><path d="M20 8l7 10h-4l6 8h-5l5 7H11l5-7h-5l6-8h-4z" fill="#0B1A0F"/><rect x="18.6" y="31" width="2.8" height="4" fill="#0B1A0F"/></svg>
    <h1>TEG Contracte</h1>
    <p>Se deschide cu contul Google <b>teg.ro</b>…</p>
    <p id="direct">Nu se încarcă? <a id="link" href="#">Deschide platforma direct</a></p>
  </div>
</div>
<script>
(function () {
  var APP = 'https://script.google.com/a/macros/teg.ro/s/AKfycby5np0GadIIN-S3m0OTLfNFx8OBZuDhxDIIeXpsmrRaHY7NvYbddfU24RhT3WbHiwAA/exec';
  document.getElementById('link').href = APP;
  var ua = navigator.userAgent;
  // Safari (iPhone, iPad, Mac) blochează logarea Google într-o pagină inclusă → acolo mergem direct
  var safari = /iPhone|iPad|iPod/.test(ua) || (/Safari\//.test(ua) && !/Chrome|Chromium|CriOS|Edg|OPR|Android/.test(ua)) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (safari) { location.replace(APP); return; }
  var f = document.createElement('iframe');
  f.title = 'TEG Contracte'; f.src = APP; f.allow = 'clipboard-read; clipboard-write; fullscreen';
  f.addEventListener('load', function () { setTimeout(function () { document.getElementById('intrare').className = 'gata'; try { f.focus(); } catch (e) {} }, 350); });
  document.body.insertBefore(f, document.body.firstChild);
  setTimeout(function () { document.getElementById('direct').className = 'vizibil'; }, 6000);
})();
</script>
</body>
</html>
